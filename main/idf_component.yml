dependencies:
  # LCD driver: esp-idf-lib on the ESP32-P4; its releases do not declare the ESP32-S31, which uses jef-sure/hd44780
  esp-idf-lib/hd44780:
    version: "^1.3.0"
    rules:
      - if: "target == esp32p4"
  esp-idf-lib/pcf8574:
    version: "^1.0.10"
    rules:
      - if: "target == esp32p4"
  jef-sure/hd44780:
    version: "^0.1.3"
    rules:
      - if: "target == esp32s31"
  espressif/mqtt: "^1.1.0"
  espressif/led_strip: "^3.0.3"
  # JSON parser of the web admin API
  espressif/cjson: "^1.7.19"
  # <name>.local and the web admin service announcement
  espressif/mdns: "^1.11.2"
